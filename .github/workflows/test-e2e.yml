name: E2E Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run end-to-end tests (Tetragon ${{ matrix.tetragon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tetragon < v1.6 is not supported (see README), it cannot load its BPF programs on Linux 7.0 runners
        tetragon: ["1.6.1", "1.7.1", "1.8.0"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: go.mod

    - name: Install Kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Verify Kind installation
      run: kind version

    - name: Start cluster
      run: make setup-test-e2e

    - name: Install Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

    - name: Verify Helm installation
      run: helm version

    - name: Install Tetragon
      run: |
        helm repo add cilium https://helm.cilium.io
        helm repo update
        helm install tetragon cilium/tetragon -n kube-system --version ${{ matrix.tetragon }} --set dnsPolicy=ClusterFirstWithHostNet
        kubectl rollout status -n kube-system ds/tetragon -w --timeout=5m

    - name: Install Kive
      run: |
        kubectl apply -f https://raw.githubusercontent.com/San7o/kivebpf/refs/heads/main/dist/install-remote.yaml
        kubectl set image -n kivebpf-system daemonset kivebpf-manager "*=ghcr.io/san7o/kivebpf:dev"
        kubectl rollout status -n kivebpf-system ds/kivebpf-manager -w --timeout=5m

    - name: Run end-to-end tests
      run: |
        go mod tidy
        make test-e2e

    - name: Dump Tetragon diagnostics
      if: failure()
      run: |
        kubectl get tracingpolicies -o yaml || true
        kubectl logs -n kube-system -l app.kubernetes.io/name=tetragon -c tetragon --tail=-1 | grep -iE "koney|level=(warn|error)" | tail -100 || true
        echo "Koney events in export-stdout: $(kubectl logs -n kube-system -l app.kubernetes.io/name=tetragon -c export-stdout --tail=-1 | grep -c koney-tracing-policy || true)"
        kubectl logs -n kube-system -l app.kubernetes.io/name=tetragon -c export-stdout --tail=-1 | grep koney-tracing-policy | head -3 || true
