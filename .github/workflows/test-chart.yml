name: Test Helm Chart

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-chart:
    name: Install Helm chart
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: go.mod

    - name: Install Kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Verify Kind installation
      run: kind version

    - name: Start cluster
      run: make setup-test-e2e

    - name: Install Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

    - name: Verify Helm installation
      run: helm version

    - name: Package Helm chart
      run: make helm-package

    - name: Build and push images
      run: |
        go mod tidy
        make docker-build docker-push

    - name: Install Helm chart
      run: |
        helm install test-koney-release ./dist/chart --create-namespace --namespace koney-system --wait --timeout 5m

    - name: Check Helm release status
      run: |
        helm status test-koney-release --namespace koney-system
